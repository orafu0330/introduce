<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>commandの自己紹介サイト！</title>

<style>
body {
    margin: 0;
    height: 100vh;
    color: white;
    font-family: sans-serif;
    overflow: hidden;
}

/* 背景 */
#bg {
    position: fixed;
    width: 100%;
    height: 100%;
    background: url("https://cdn-gallery.skima.jp/gallery/305/779/305779/c3007ca12674aa81f6e425b3f4c67854-20210524233513.jpeg") center/cover no-repeat;
    filter: blur(6px);
    transform: scale(1.1);
    z-index: 0;
}

#overlay {
    position: fixed;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, rgba(30,58,138,0.7), rgba(2,6,23,0.9));
    z-index: 1;
}

/* メイン */
#main {
    position: relative;
    z-index: 2;
    text-align: center;
    top: 50%;
    transform: translateY(-50%);
}

/* チルノ */
#cirno {
    width: 300px;
    display: block;
    margin: 0 auto;
    opacity: 0;
    transform: scale(0.7);
    transition: 1.5s;
}

/* テキスト */
#text {
    opacity: 0;
    font-size: 24px;
    margin-top: 30px;
    white-space: pre-line;
}

/* YouTube */
#youtube {
    opacity: 0;
    margin-top: 40px;
    transform: translateY(20px);
    transition: 1s;
}

/* ===== ボタン ===== */
.yt-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;

    padding: 12px 20px;
    background: #ff0000;
    color: white;
    text-decoration: none;
    border-radius: 10px;
    font-weight: bold;

    transition: 0.3s;
    box-shadow: 0 0 15px rgba(255,0,0,0.6);
}

/* ホバー */
.yt-btn:hover {
    background: #cc0000;
    transform: scale(1.07);
}

/* ロゴ */
.yt-icon {
    width: 24px;
    height: 24px;
}
</style>
</head>

<body>

<div id="bg"></div>
<div id="overlay"></div>

<div id="main">
    <img id="cirno" src="https://yt3.ggpht.com/WfmBJ56DV1snb2SquKtOhYjXlhZhpOXuUpIndd7z81HVry1DuX63DK3Q-eFVaZnire4xjAnj=s600-c-k-c0x00ffffff-no-rj-rp-mo">

    <div id="text"></div>

    <div id="youtube">
        <a class="yt-btn" href="https://www.youtube.com/channel/UCwrIoZ_GLrOya2m4A-Z82Qg/" target="_blank">
            <!-- YouTubeロゴ -->
            <svg class="yt-icon" viewBox="0 0 24 24" fill="white">
                <path d="M23.5 6.2s-.2-1.6-.8-2.3c-.8-.9-1.7-.9-2.1-1C17.7 2.7 12 2.7 12 2.7h0s-5.7 0-8.6.2c-.4.1-1.3.1-2.1 1C.7 4.6.5 6.2.5 6.2S.3 8 .3 9.8v1.4C.3 13 .5 14.8.5 14.8s.2 1.6.8 2.3c.8.9 1.9.9 2.4 1 1.7.2 7.3.2 7.3.2s5.7 0 8.6-.2c.4-.1 1.3-.1 2.1-1 .6-.7.8-2.3.8-2.3s.2-1.8.2-3.6V9.8c0-1.8-.2-3.6-.2-3.6zM9.8 14.3V7.7l6.2 3.3-6.2 3.3z"/>
            </svg>

            YouTubeチャンネルを見る
        </a>
    </div>
</div>

<script>
const message = "おはちるの～commandです！";

window.onload = () => {
    const cirno = document.getElementById("cirno");
    const text = document.getElementById("text");
    const youtube = document.getElementById("youtube");

    // チルノ登場
    setTimeout(() => {
        cirno.style.opacity = 1;
        cirno.style.transform = "scale(1)";
    }, 500);

    // タイピング
    setTimeout(() => {
        text.style.opacity = 1;

        let i = 0;
        const interval = setInterval(() => {
            text.textContent += message[i];
            i++;
            if (i >= message.length) {
                clearInterval(interval);

                // YouTube表示
                setTimeout(() => {
                    youtube.style.opacity = 1;
                    youtube.style.transform = "translateY(0)";
                }, 500);
            }
        }, 80);
    }, 2000);
};
</script>

</body>
</html>
